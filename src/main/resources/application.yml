spring:
  application:
    name: clean-architecture-spring-boot-template
  datasource:
    # Supply these via environment variables (see .env.example). The defaults
    # here point at a local Postgres and are NOT secrets.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cleanarch}
    username: ${DB_USERNAME:cleanarch}
    password: ${DB_PASSWORD:change-me-local-only}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only validates it against the entities.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # NEVER commit a real signing secret. Provide APP_JWT_SECRET from the
    # environment. The placeholder below is intentionally non-production and
    # must be at least 32 bytes for HS256.
    secret: ${APP_JWT_SECRET:REPLACE_WITH_A_32_BYTE_RANDOM_SECRET_0000}
    ttl-seconds: ${APP_JWT_TTL_SECONDS:3600}
  ratelimit:
    max-requests: ${APP_RATELIMIT_MAX_REQUESTS:120}
    window-seconds: ${APP_RATELIMIT_WINDOW_SECONDS:60}

management:
  endpoints:
    web:
      exposure:
        include: health,info
